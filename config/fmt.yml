---
cfg:
  type: stream
  bin: sortd
  args:
    - cfg
  filetypes:
    - cfg
    - confini
    - ini
  install:
    pip:
      - sortd

json:
  type: stream
  bin: sortd
  args:
    - json
  filetypes:
    - json
    - jsonc

# toml1:
#   bin: sortd
#   args:
#     - toml
#   type: stream
#   filetypes:
#     - gitconfig

toml:
  type: stream
  bin: taplo
  args:
    - format
    - --option=align_entries=true
    - --option=array_trailing_comma=true
    - --option=reorder_keys=true
    - --
    - "-"
  filetypes:
    - gitconfig
    - toml

dtsfmt:
  type: stream
  bin: dtsfmt
  args:
    - --stdin
    - --
    - "-"
  filetypes:
    - dts
  install:
    requires:
      - jq
    script:
      file: dtsfmt.sh

shell:
  type: stream
  bin: shfmt
  args:
    - --simplify
    - --binary-next-line
    - --space-redirects
    - --indent=${tabsize}
  filetypes:
    - env
    - sh
    - zsh
  install:
    requires:
      - jq
    script:
      file: shfmt.sh

pwsh:
  type: stream
  bin: pwsh-fmt.ps1
  args: []
  filetypes:
    - ps1

prolog:
  type: stream
  bin: prolog-fmt.pro
  args: []
  filetypes:
    - prolog

haskell:
  type: stream
  bin: stylish-haskell
  args: []
  filetypes:
    - haskell
  install:
    requires:
      - jq
      - runhaskell
    script:
      file: stylish.dl.hs

systemd:
  type: stream
  bin: systemd-fmt.sh
  args: []
  filetypes:
    - systemd

perl:
  type: stream
  bin: perltidy.pl
  args:
    - --indent-columns=2
  filetypes:
    - perl

docker:
  type: stream
  bin: dockerfile-utils
  args:
    - format
    - --spaces
    - ${tabsize}
    - ${tmpname}
  filetypes:
    - dockerfile

isort:
  type: stream
  bin: isort
  args:
    - --profile=black
    - --filename=${filename}
    - --
    - "-"
  filetypes:
    - python
  install:
    pip:
      - isort

black:
  type: stream
  bin: black
  args:
    - --stdin-filename=${filename}
    - --
    - "-"
  filetypes:
    - python
  install:
    pip:
      - black

clojure:
  type: stream
  bin: cljfmt
  args:
    - fix
    - --remove-multiple-non-indenting-spaces
    - --sort-ns-references
    - --split-keypairs-over-multiple-lines
    - --
    - "-"
  filetypes:
    - clojure
  install:
    requires:
      - clojure
    script:
      file: clj_fmt.clj

# css:
#   type: stream
#   bin: csscomb
#   args:
#     - --
#     - ${tmpname}
#   filetypes:
#     - css
#   install:
#     npm:
#       - csscomb

prettier:
  type: stream
  bin: prettier.js
  args:
    - --filetype=${filetype}
    - --filename=${filename}
    - --tabsize=${tabsize}
    - --sort
  filetypes:
    - awk
    - css
    - graphql
    - html
    - javascript*
    - json*
    - less
    - liquid
    - markdown
    - nginx
    - scss
    - typescript*
    - typespec
    - xml
    - yaml*
  install:
    npm:
      # - prettier-plugin-awk
      - "@prettier/plugin-xml"
      - "@typespec/prettier-plugin-typespec"
      - prettier
      - prettier-plugin-nginx
      - prettier-plugin-organize-imports
      - prettier-plugin-tailwindcss
    requires:
      - node
    script:
      file: prettier.dl.js

rubocop:
  type: stream
  bin: rubocop.rb
  args:
    - ${filename}
    - --fail-level=fatal
    - --stderr
    - --stdin
    - --format=quiet
    - --no-color
    - --autocorrect
  filetypes:
    - ruby

syntax_tree:
  type: stream
  bin: stree
  args:
    - write
    - --plugin=rbs
    - --
    - ${filename}
  filetypes:
    - rbs
  install:
    gem:
      - syntax_tree
      - syntax_tree-rbs

php:
  type: fs
  bin: php
  args:
    - -l
    - ${tmpname}
  filetypes:
    - php

php_cs_fixer:
  type: fs
  bin: php-cs-fixer
  args:
    - --no-interaction
    - fix
    - --
    - ${tmpname}
  filetypes:
    - php
  install:
    requires:
      - php
    script:
      file: php_cs_fixer.php

lua:
  type: stream
  bin: luafmt
  args:
    - --line-width=80
    - --indent-count=${tabsize}
    - --stdin
  filetypes:
    - lua
  install:
    npm:
      - lua-fmt

rust:
  type: stream
  bin: rustfmt
  args:
    - --edition=2021
  filetypes:
    - rust

swift:
  type: stream
  bin: swift-format
  args:
    - format
    - --assume-filename=${filename}
    - --
  filetypes:
    - swift

go:
  type: stream
  bin: goimports
  filetypes:
    - go
  install:
    requires:
      - go
    script:
      file: goimports.go

c:
  type: stream
  bin: clang-format
  args:
    - --Werror
    - --assume-filename=${filename}
  filetypes:
    - c
    - cpp
    - cs
    - objc

fortran:
  type: stream
  bin: fprettify
  args: []
  filetypes:
    - fortran
  install:
    pip:
      - fprettify

latex:
  type: stream
  bin: latexindent.pl
  args: []
  filetypes:
    - plaintex
    - tex
  install:
    requires:
      - gcc
      - jq
      - perl
    script:
      file: latexindent.dl.pl

fsharp:
  type: fs
  bin: fantomas.fsx
  args:
    - ${tmpname}
  filetypes:
    - fsharp
  install:
    requires:
      - dotnet
    script:
      file: fantomas.dl.fsx

kotlin:
  type: stream
  bin: ktfmt.java
  args:
    - ${tabsize}
    - --stdin-name=${filename}
    - "-"
  filetypes:
    - kotlin
  install:
    requires:
      - kotlinc
    script:
      file: ktfmt.dl.kts

java:
  type: stream
  bin: javafmt.java
  args:
    - "-"
  filetypes:
    - java
  install:
    requires:
      - java
      - jq
    script:
      file: javafmt.dl.java
r:
  type: fs
  bin: styler.r
  args:
    - ${tmpname}
  filetypes:
    - r
  install:
    requires:
      - Rscript
      - R
    script:
      file: styler.dl.r

sql:
  type: stream
  bin: sql-formatter
  args:
    # - --uppercase
    # - --lines-between-queries=2
    # - --indent=${tabsize}
    - --language=postgresql
  filetypes:
    - sql
  install:
    npm:
      - sql-formatter

eslint:
  type: fs
  bin: eslint.js
  args:
    - ${filename}
    - ${tmpname}
  filetypes:
    - javascript*
    - typescript*
  install:
    requires:
      - node
    script:
      file: eslint.dl.js

terraform:
  type: stream
  bin: terraform
  args:
    - fmt
    - "-"
  filetypes:
    - hcl
    - terraform
  install:
    requires:
      - jq
    script:
      file: terraform.sh
