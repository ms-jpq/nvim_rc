---
vint:
  type: fs
  args:
    - --enable-neovim
    - --style-problem
    - --
    - ${tmpname}
  # https://github.com/Vimjas/vint/issues/369
  filetypes:
    - vim
  install:
    pip:
      - vim-vint

shellcheck:
  type: fs
  args:
    - --enable=all
    - --
    - ${tmpname}
  filetypes:
    - sh
    - zsh
  install:
    requires:
      - jq
    script:
      file: shellcheck.sh

perlcritic.pl:
  type: stream
  args:
    - --brutal
    - --
  filetypes:
    - perl
  install:
    requires:
      - perl
    script:
      file: perlcritic.dl.pl

pwsh-lint.ps1:
  type: fs
  args:
    - ${tmpname}
  filetypes:
    - ps1

mypy:
  type: fs
  args:
    - --
    - ${tmpname}
  filetypes:
    - python
  install:
    pip:
      - mypy

clj-kondo:
  type: stream
  args:
    - --filename
    - ${filename}
    - --lint
    - "-"
  filetypes:
    - clojure
  install:
    requires:
      - clojure
    script:
      file: clj_lint.clj

hadolint:
  type: fs
  args:
    - --no-color
    - --
    - ${tmpname}
  filetypes:
    - dockerfile
  install:
    script:
      file: hadolint.sh

golangci-lint:
  type: fs
  args:
    - run
    - --enable-all
    - --
    - ${tmpname}
  filetypes:
    - go
  install:
    requires:
      - go
    script:
      file: golangci_lint.go

rubocop.rb:
  type: stream
  args:
    - ${filename}
    - --no-color
    - --stdin
    - --stderr
  filetypes:
    - ruby
  install:
    gem:
      - rubocop
    requires:
      - ruby
    script:
      file: rubocop.dl.rb

lintr.r:
  type: fs
  args:
    - ${tmpname}
  filetypes:
    - r
  install:
    requires:
      - Rscript
      - R
    script:
      file: lintr.dl.r

htmlhint:
  type: fs
  args:
    - --nocolor
    - --
    - ${tmpname}
  filetypes:
    - html
  install:
    npm:
      - htmlhint

phpstan:
  type: fs
  args:
    - analyse
    - --no-progress
    - --
    - ${tmpname}
  filetypes:
    - php
  install:
    requires:
      - php
    script:
      file: phpstan.dl.php

phan:
  type: fs
  args:
    - --allow-polyfill-parser
    - --no-progress-bar
    - --strict-type-checking
    - --analyze-twice
    - ${tmpname}
  filetypes:
    - php

lint-openapi:
  type: fs
  args:
    - --
    - ${tmpname}
  filetypes:
    - openapi.json
    - openapi.yaml
  install:
    npm:
      - ibm-openapi-validator
